name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A release publishes the version its tag names (v0.1.0 -> 0.1.0); a
      # manual run publishes the snapshot version in gradle.properties.
      - name: Work out the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$TAG" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
          echo "Publishing version $VERSION"
          echo "args=-Pversion=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build ${{ steps.version.outputs.args }} --stacktrace

      - name: Publish
        run: ./gradlew :lib:publishMavenPublicationToGitHubPackagesRepository ${{ steps.version.outputs.args }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
